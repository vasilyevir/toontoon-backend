# Выкат бэкенда на сервер.
#
# Прежняя версия этого файла выкатывала в Kubernetes чужой организации —
# инфраструктуры той уже нет. Сейчас сервер один и без кубера (Илья,
# 2026-09-11), поэтому выкат простой: код уезжает по ssh, там пересобирается
# образ и поднимается compose.
#
# Два окружения — две среды GitHub со своими секретами: `production` (ветка
# main) и `staging` (ветка staging). Секреты лежат в среде, а не в репозитории:
# так ключ от боевого сервера недоступен ветке, которую может открыть кто
# угодно.
#
# Секреты среды: SSH_HOST, SSH_USER, SSH_KEY (приватный ключ), DEPLOY_PATH.
# Файл .env.prod на сервер кладётся руками и в репозиторий не попадает.
#
# Экшены прибиты к SHA, а не к тегу: тег — движущаяся ссылка, и владелец
# экшена может переставить её на другой коммит, который выполнится здесь с
# ключом от нашего сервера.
name: Выкат

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: Куда выкатывать
        type: choice
        options: [production, staging]
        default: staging

concurrency:
  # Два выката подряд не должны встретиться на сервере: второй ждёт первого.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: >-
        ${{ github.event.inputs.environment
            || (github.ref == 'refs/heads/main' && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Ключ доступа
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Код на сервер
        # rsync, а не git pull на сервере: серверу тогда не нужен доступ к
        # GitHub, а значит и ключ от репозитория на нём не лежит. Исключаем
        # всё, чего на сервере быть не должно, и НЕ трогаем .env.prod —
        # секреты живут только там.
        run: |
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude '.venv' \
            --exclude '__pycache__' --exclude '*.pyc' --exclude '.pytest_cache' \
            --exclude 'uploads' --exclude '.local-tls' \
            --exclude 'deploy/vps/.env.prod' \
            -e "ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/"

      - name: Сборка, миграции, каталог, проверка
        run: |
          ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash ${{ secrets.DEPLOY_PATH }}/deploy/vps/deploy.sh ${{ job.environment || 'production' }}"

      - name: Здоровье снаружи
        # Последняя проверка — с чужой машины: изнутри сервера сервис может
        # отвечать, а наружу быть закрыт nginx-ом или файрволом.
        run: |
          code=$(curl -sk -o /dev/null -m 15 -w "%{http_code}" "https://${{ secrets.SSH_HOST }}/health")
          echo "health снаружи: $code"
          [ "$code" = "200" ]
