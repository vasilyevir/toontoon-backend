# Build & Deploy через общий Helm-чарт (backend).
# Требуются секреты репо: KUBECONFIG, GHCR_READ_PAT (read:packages).
#
# Экшены прибиты к SHA, а не к тегу. Тег в GitHub Actions — движущаяся ссылка:
# владелец экшена (или тот, кто получил доступ к его репозиторию) переставляет
# `v4` на другой коммит, и он выполняется здесь — с `packages: write` и
# kubeconfig кластера в секретах. Комментарий рядом с SHA держит версию
# читаемой; обновлять их — руками и осознанно.
name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # ghcr требует lowercase; имя орги содержит заглавные → путь захардкожен.
  IMAGE: ghcr.io/atom-group-software/toontoon-web-backend
  CHART: oci://ghcr.io/atom-group-software/charts/app
  CHART_VERSION: "0.2.0"
  RELEASE: toontoon-web-backend
  NAMESPACE: toontoon-web

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Явно и по минимуму. Без этого блока job берёт умолчания репозитория —
    # а в руках у него kubeconfig кластера, и лишние права здесь стоят дороже
    # всего остального в этом файле.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Helm registry login
        run: echo "${{ secrets.GHCR_READ_PAT }}" | helm registry login ghcr.io -u eerixxx --password-stdin
      - name: Helm upgrade --install
        run: |
          helm upgrade --install "$RELEASE" "$CHART" \
            --version "$CHART_VERSION" \
            -n "$NAMESPACE" --create-namespace \
            -f deploy/values.yaml \
            --set image.tag=${{ needs.build.outputs.image_tag }} \
            --wait --timeout 180s
