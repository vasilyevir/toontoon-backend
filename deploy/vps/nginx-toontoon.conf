# /etc/nginx/sites-enabled/toontoon — вместо arteki и arteki-ssl.
#
# Отличия от старого конфига — и все три намеренные:
#   * нет location /uploads/ — лица больше не лежат публично; кадры отдаёт
#     /api/media/{id} после проверки владельца;
#   * нет location / → Next.js: прототип мобильный, старый веб-фронт погашен;
#   * :80 только редиректит на :443.
server {
    listen 80;
    server_name 193.149.190.155 _;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name 193.149.190.155 _;
    ssl_certificate     /etc/nginx/ssl/arteki.crt;   # самоподписанный; приложение пинит SPKI
    ssl_certificate_key /etc/nginx/ssl/arteki.key;
    client_max_body_size 15m;                        # снимок с телефона; в коде тот же потолок

    location /api/     { proxy_pass http://127.0.0.1:8000/api/;     proxy_read_timeout 300; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /health { proxy_pass http://127.0.0.1:8000/health; }
    location = /terms  { proxy_pass http://127.0.0.1:8000/terms; }
    location = /privacy{ proxy_pass http://127.0.0.1:8000/privacy; }
    location /          { return 404; }
}
