# /etc/nginx/sites-enabled/toontoon (вместо default).
#
# Источник истины — этот файл в репозитории, на машину он кладётся копией:
#   scp deploy/vps/nginx-toontoon.conf toontoon:/tmp/toontoon.conf
#   ssh toontoon 'sudo install -m 644 /tmp/toontoon.conf \
#     /etc/nginx/sites-enabled/toontoon && sudo nginx -t && sudo systemctl reload nginx'
#
# Наружу торчат только четыре пути. Кадры и лица публично не лежат — их отдаёт
# /api/media/{id} после проверки владельца.
#
# Два входа в одно и то же приложение:
#
# * toontoon.atom.mobile — имя и настоящий сертификат Let's Encrypt. Сюда
#   ходят сборки с 28 сентября 2026.
# * голый IP 94.131.94.5 с самоподписанным сертификатом — сюда ходят все
#   сборки до того дня, включая 190-ю в TestFlight. Они принимают его по пину
#   (TOONTOON_PINNED_SPKI), настоящий сертификат им не подходит, поэтому этот
#   вход снимать нельзя, пока такие сборки живы.
#
# На этой же машине живут соседи (orbit.atom.mobile, vertoon.atom.mobile).
# Их nginx выбирает по имени, а тому, кто пришёл по IP, отвечает сайт с
# пометкой default_server. 22 сентября 2026 её не было ни у кого, соседа
# добавили раньше нас по алфавиту — и обращения по IP полдня уходили к нему
# вместе с его сертификатом: приложение показывало пустой каталог. Пометка
# ниже — чтобы это не повторилось.

server {
    listen 80 default_server;
    server_name _;

    # Подтверждение владения доменом для certbot: продление идёт по http, и
    # редирект на https его ломает.
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# Имя и настоящий сертификат.
server {
    # http2: главная — это десятки картинок разом, и по HTTP/1.1 телефон
    # держит к серверу лишь несколько соединений, а остальное ждёт очереди.
    # По HTTP/2 всё идёт одним соединением (21 сентября 2026). Синтаксис
    # nginx 1.24; с 1.25 — отдельной строкой `http2 on;`.
    listen 443 ssl http2;
    server_name toontoon.atom.mobile;

    ssl_certificate     /etc/letsencrypt/live/toontoon.atom.mobile/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/toontoon.atom.mobile/privkey.pem;

    client_max_body_size 15m;                        # снимок с телефона; в коде тот же потолок

    location /api/     { proxy_pass http://127.0.0.1:8000/api/;     proxy_read_timeout 300; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /health { proxy_pass http://127.0.0.1:8000/health; }
    location = /terms  { proxy_pass http://127.0.0.1:8000/terms; }
    location = /privacy{ proxy_pass http://127.0.0.1:8000/privacy; }
    location /          { return 404; }
}

# Старый вход по IP: самоподписанный сертификат и пин в приложении.
server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/toontoon.crt;
    ssl_certificate_key /etc/nginx/ssl/toontoon.key;

    client_max_body_size 15m;

    location /api/     { proxy_pass http://127.0.0.1:8000/api/;     proxy_read_timeout 300; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location = /health { proxy_pass http://127.0.0.1:8000/health; }
    location = /terms  { proxy_pass http://127.0.0.1:8000/terms; }
    location = /privacy{ proxy_pass http://127.0.0.1:8000/privacy; }
    location /          { return 404; }
}
