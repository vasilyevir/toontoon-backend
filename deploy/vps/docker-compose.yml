# Прототип на одном VPS (TestFlight). Не прод: без реплик, без бэкапов по
# расписанию, TLS — самоподписанный серт, который приложение принимает по пину.
#
#   docker compose --env-file .env.prod up -d --build
#   docker compose --env-file .env.prod run --rm api alembic upgrade head
#
# nginx на хосте терминирует TLS и проксирует только /api/, /health, /terms,
# /privacy на 127.0.0.1:8000 (deploy/vps/nginx-toontoon.conf). Кадры наружу не
# торчат: их отдаёт /api/media/{id} после проверки владельца.
services:
  api:
    build: ../..
    restart: unless-stopped
    env_file: [.env.prod]
    environment:
      WORKER_MODE: queue
      DATABASE_URL: postgresql+asyncpg://toontoon:${POSTGRES_PASSWORD}@postgres:5432/toontoon
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      # Хранилище — из .env.prod (S3_*). Раньше адрес был зашит здесь и
      # перекрывал .env.prod: переезд на другое хранилище требовал правки
      # этого файла на сервере руками. Значений по умолчанию нет намеренно:
      # с 28 сентября 2026 кадры лежат в Яндексе (Казахстан), MinIO рядом
      # больше не поднимается, и подстановка его адреса молча увела бы
      # хранилище в никуда.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:8000:8000"]
    depends_on: [postgres, redis]

  worker:
    build: ../..
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: [.env.prod]
    environment:
      WORKER_MODE: queue
      WORKER_CONCURRENCY: "4"
      DATABASE_URL: postgresql+asyncpg://toontoon:${POSTGRES_PASSWORD}@postgres:5432/toontoon
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      # Хранилище — из .env.prod (S3_*). Раньше адрес был зашит здесь и
      # перекрывал .env.prod: переезд на другое хранилище требовал правки
      # этого файла на сервере руками. Значений по умолчанию нет намеренно:
      # с 28 сентября 2026 кадры лежат в Яндексе (Казахстан), MinIO рядом
      # больше не поднимается, и подстановка его адреса молча увела бы
      # хранилище в никуда.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on: [postgres, redis]

  retention:
    build: ../..
    restart: unless-stopped
    # Раз в сутки стирать снимки заброшенных гостей (см. scripts/retention.py).
    command: ["sh", "-c", "while true; do python scripts/retention.py --apply; sleep 86400; done"]
    env_file: [.env.prod]
    environment:
      DATABASE_URL: postgresql+asyncpg://toontoon:${POSTGRES_PASSWORD}@postgres:5432/toontoon
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      # Хранилище — из .env.prod (S3_*). Раньше адрес был зашит здесь и
      # перекрывал .env.prod: переезд на другое хранилище требовал правки
      # этого файла на сервере руками. Значений по умолчанию нет намеренно:
      # с 28 сентября 2026 кадры лежат в Яндексе (Казахстан), MinIO рядом
      # больше не поднимается, и подстановка его адреса молча увела бы
      # хранилище в никуда.
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    depends_on: [postgres]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: toontoon
      POSTGRES_USER: toontoon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes: [redisdata:/data]

volumes:
  pgdata: {}
  redisdata: {}
  # miniodata остаётся на диске машины намеренно: это копия кадров до переезда
  # в Яндекс (21 сентября 2026). Сам MinIO с 28 сентября не поднимается —
  # `docker volume rm toontoon-production_miniodata`, когда копия перестанет
  # быть нужна.
